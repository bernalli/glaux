[profile.default]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "prague"
optimizer = true
optimizer_runs = 10000

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 32
fail_on_revert = false

[fmt]
line_length = 100

# The vendored daimo P256Verifier, used only as a test oracle etched at the
# precompile address, pins solc 0.8.21 and needs via_ir. Glaux's own contracts stay
# on 0.8.28 without via_ir; these restrictions keep the two apart instead of editing
# the vendored source or widening the pipeline for deployed code.
[[profile.default.additional_compiler_profiles]]
name = "via-ir"
via_ir = true

[[profile.default.compilation_restrictions]]
paths = "{src,script}/**"
version = "=0.8.28"

[[profile.default.compilation_restrictions]]
paths = "test/oracle/**"
via_ir = true
