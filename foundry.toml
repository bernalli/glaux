[profile.default]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "prague"
optimizer = true
optimizer_runs = 10000
# Test-only: lets StorageParity.t.sol read and (re)generate the committed parity
# fixture that scripts/test_reconcile.py asserts from the Python side. Declaring
# fs_permissions makes the list EXCLUSIVE, so out/ must be re-granted or
# vm.getDeployedCode (the P-256 oracle etch in every test) loses read access.
# No effect on compiled bytecode.
fs_permissions = [
    { access = "read", path = "./out" },
    { access = "read-write", path = "./test/fixtures" },
]
# Deployed bytecode must be reproducible from source alone. Foundry's default
# appends a CBOR metadata hash covering compiler settings, source unit NAMES and
# the keccak of every source file including its comments — and that hash feeds
# both the CREATE2 address and the runtime code hash every birth blob commits to. With
# it, editing a comment moves the canonical address and silently invalidates
# every unspent blob; a chain the account has not reached yet could then never be
# born on. "none" strips it.
bytecode_hash = "none"

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 32
fail_on_revert = true

[fmt]
line_length = 100

# The vendored daimo P256Verifier, used only as a test oracle etched at the
# precompile address, pins solc 0.8.21 and needs via_ir. Glaux's own contracts stay
# on 0.8.28 without via_ir; these restrictions keep the two apart instead of editing
# the vendored source or widening the pipeline for deployed code.
[[profile.default.additional_compiler_profiles]]
name = "via-ir"
via_ir = true

[[profile.default.compilation_restrictions]]
paths = "{src,script}/**"
version = "=0.8.28"

[[profile.default.compilation_restrictions]]
paths = "test/oracle/**"
via_ir = true
