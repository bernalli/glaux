name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: src imports no account-abstraction dependency
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          def fail(message):
              raise SystemExit(f"::error::{message}")

          def walk_error(error):
              fail(str(error))

          root = Path.cwd().resolve()
          source_dir = root / "src"
          forbidden = (root / "lib/account-abstraction").resolve(strict=True)
          if not source_dir.is_dir() or source_dir.is_symlink():
              fail("src/ must be a real directory")
          sources = []
          for directory, dirs, files in os.walk(source_dir, onerror=walk_error):
              for name in dirs + files:
                  path = Path(directory) / name
                  if path.is_symlink():
                      fail(f"symlink under src/: {path}")
              sources.extend(Path(directory) / name for name in files if name.endswith(".sol"))
          if not sources:
              fail("no Solidity sources under src/")
          for source in sorted(sources):
              relative = source.relative_to(root).as_posix()
              result = subprocess.run(
                  ["forge", "flatten", relative],
                  cwd=root, text=True, capture_output=True, check=True,
              )
              units = set()
              for name in re.findall(r"^// (.+?)\s*$", result.stdout, re.MULTILINE):
                  candidate = root / name
                  try:
                      if not candidate.is_file():
                          continue
                  except OSError:
                      continue
                  units.add(candidate.resolve(strict=True))
              if source.resolve(strict=True) not in units:
                  fail(f"missing source marker in forge flatten output: {relative}")
              for unit in units:
                  if unit == forbidden or forbidden in unit.parents:
                      fail(f"{relative} depends on {unit.relative_to(root)}")
          print(f"Checked {len(sources)} Solidity sources and their resolved imports")
          PY
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vvv
  slither:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Slither compiles through crytic-compile, which detects the Foundry
      # project and shells out to `forge`. Install it explicitly: the action
      # only auto-installs Foundry when it finds a foundry.toml inside the
      # target directory, so a target of "src/" leaves forge missing entirely.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      # Target the project root, not src/, so crytic-compile gets the real
      # Foundry project. Scoping to first-party code is slither.config.json's
      # job (filter_paths excludes lib/, test/ and script/) and the two targets
      # produce identical findings.
      # Fail loudly rather than skipping: a gate that silently passes when it
      # analysed nothing is worse than no gate. Slither is the authoritative
      # analyser here, so an empty source set is a CI failure, not a green run.
      - name: Assert there are contracts to analyse
        run: test -n "$(find src -name '*.sol' -print -quit)" || { echo "::error::no Solidity sources under src/ — Slither would analyse nothing"; exit 1; }
      - uses: crytic/slither-action@v0.4.0
        with: { target: ".", fail-on: high, slither-config: "slither.config.json" }
  aderyn:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      # Pinned to the exact release the false-positive triage in
      # docs/static-analysis.md was carried out against, and verified by digest.
      # A floating version would change both the detector set and which of the
      # `// aderyn-fp-next-line` suppressions still line up with a real finding.
      - name: Install aderyn (pinned)
        run: |
          curl -sSLo aderyn.tar.xz \
            https://github.com/Cyfrin/aderyn/releases/download/aderyn-v0.6.8/aderyn-x86_64-unknown-linux-gnu.tar.xz
          echo "ffd6ca658962e211a3ac821c646f69c8e14bf1b1001cbfe091bcd4535a691e46  aderyn.tar.xz" | sha256sum -c -
          tar -xJf aderyn.tar.xz
          echo "$PWD/aderyn-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      - run: aderyn --src src --path-excludes lib,test,script -o aderyn-report.json --highs-only
      # Aderyn ALWAYS exits 0 — verified in its own driver.rs — so `run:` alone
      # would be a gate that is green forever, including on a run that found real
      # bugs. The gate is the report parser, which also fails closed when the
      # report is missing or malformed. Slither stays the authoritative gate.
      - run: python scripts/aderyn_gate.py --report aderyn-report.json
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      # The scripts build the blobs the contracts verify: they are first-party
      # code and get the same gate the Solidity does. The pytest asserts the
      # committed storage-parity fixture from the Python side.
      # ruff/pytest pinned so the lint+test gate is reproducible and matches the
      # local .venv (ruff 0.16.1, pytest 9.1.1). The ruff behaviour itself is
      # pinned by the [tool.ruff] section in the root pyproject.toml.
      - run: pip install -r scripts/requirements.txt ruff==0.16.1 pytest==9.1.1
      - run: ruff check scripts
      - run: python -m pytest scripts -q
  node:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v5
      # The eligibility test suite spawns real anvil instances and etches the
      # vendored P256Verifier artifact from `out/`: both need Foundry on PATH
      # and a build done before `npm test` runs.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: forge build
        working-directory: ${{ github.workspace }}
      # Four tests in `sdk/test/reconcile.test.ts` cross-check their verdict
      # against the REAL `scripts/reconcile.py`, spawned from `.venv/bin/python`
      # at the repo root — the whole point of the port is that both tools agree
      # on the same chain state. Without the venv that spawn yields exit code
      # `null` and those four fail, which is exactly how this job broke the
      # first time it ran them: locally the venv always exists, so the gap was
      # invisible until main went red. The `python` job builds its own
      # environment and cannot serve this one.
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python -m venv .venv && .venv/bin/pip install -r scripts/requirements.txt
        working-directory: ${{ github.workspace }}
      - uses: actions/setup-node@v5
        with: { node-version: "20", cache: "npm", cache-dependency-path: sdk/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
